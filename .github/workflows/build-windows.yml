name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install project dependencies
        run: |
          pipenv install
          pipenv install --dev pyinstaller

      - name: Build executable with PyInstaller
        run: pipenv run pyinstaller build.spec --noconfirm

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/auto_art_v2.exe")) {
            Write-Error "Executable not found at dist/auto_art_v2.exe"
            exit 1
          }
          Get-Item "dist/auto_art_v2.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto_art_v2-windows
          path: dist/auto_art_v2.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/auto_art_v2.exe
          fail_on_unmatched_files: true
