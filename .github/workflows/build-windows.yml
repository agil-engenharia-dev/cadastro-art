name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.2.0). Se preenchida, cria/atualiza o Release com o .exe."
        required: true
        type: string
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # Remove espaços e garante prefixo v opcionalmente aceito como informado
          TAG="$(echo "$TAG" | xargs)"

          if [ -z "$TAG" ]; then
            echo "Tag vazia."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install project dependencies
        run: |
          pipenv install
          pipenv install --dev pyinstaller

      - name: Build executable with PyInstaller
        run: pipenv run pyinstaller build.spec --noconfirm

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/auto_art_v2.exe")) {
            Write-Error "Executable not found at dist/auto_art_v2.exe"
            exit 1
          }
          Get-Item "dist/auto_art_v2.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto_art_v2-windows-${{ steps.meta.outputs.tag }}
          path: dist/auto_art_v2.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create/Update GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: dist/auto_art_v2.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
