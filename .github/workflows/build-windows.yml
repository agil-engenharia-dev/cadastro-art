name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.2.0). Cria/atualiza o Release com o .exe."
        required: true
        type: string
      changelog:
        description: "Changelog da release (Markdown). Ex.: - Correção X\\n- Melhoria Y"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag and exe name
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG="$(echo "$TAG" | xargs)"

          if [ -z "$TAG" ]; then
            echo "Tag vazia."
            exit 1
          fi

          # Tag v1.2.0 → auto_art_v1.2.0.exe
          EXE_NAME="auto_art_${TAG}"
          EXE_FILE="${EXE_NAME}.exe"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "exe_name=$EXE_NAME" >> "$GITHUB_OUTPUT"
          echo "exe_file=$EXE_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG exe=$EXE_FILE"

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          CHANGELOG: ${{ github.event_name == 'workflow_dispatch' && inputs.changelog || '' }}
        run: |
          # Converte \n literais (UI do Actions) em quebras de linha reais
          NOTES="$(printf '%b' "$CHANGELOG" | sed 's/\r$//')"

          if [ -n "$(echo "$NOTES" | xargs)" ]; then
            printf '%s\n' "$NOTES" > release_notes.md
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
            echo "Changelog informado — será usado no body do Release."
          else
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
            echo "Sem changelog — notes serão geradas automaticamente."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install project dependencies
        run: |
          pipenv install
          pipenv install --dev pyinstaller

      - name: Build executable with PyInstaller
        env:
          APP_EXE_NAME: ${{ steps.meta.outputs.exe_name }}
        run: pipenv run pyinstaller build.spec --noconfirm

      - name: Verify executable
        shell: pwsh
        env:
          EXE_FILE: ${{ steps.meta.outputs.exe_file }}
        run: |
          $path = "dist/$env:EXE_FILE"
          if (-not (Test-Path $path)) {
            Write-Error "Executable not found at $path"
            exit 1
          }
          Get-Item $path | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.exe_name }}-windows
          path: dist/${{ steps.meta.outputs.exe_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Create/Update GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: dist/${{ steps.meta.outputs.exe_file }}
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.has_changelog == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_changelog != 'true' }}
          target_commitish: ${{ github.sha }}
